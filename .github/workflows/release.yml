name: Release

# v0.1.0 のようなタグを push すると npm に公開する。
# 事前に: repo の Secrets に NPM_TOKEN（npm の Automation token）を登録し、
# packages/cli/package.json の version をタグと一致させておくこと。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG" != "$PKG" ]; then echo "tag v$TAG != packages/cli version $PKG"; exit 1; fi
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
